# ═══════════════════════════════════════════════════════════════
# ClawClip Default Configuration
# ═══════════════════════════════════════════════════════════════
# This file ships with ClawClip and should NOT be edited.
# Override values in config/local.yaml (auto-generated by setup wizard).
# Environment variables: ${VAR_NAME} or ${VAR_NAME:default_value}

app:
  name: "ClawClip"
  version: "0.1.0"
  log_level: "${LOG_LEVEL:INFO}"
  debug: false
  data_dir: "${CLAWCLIP_DATA_DIR:./data}"

# ── Database ────────────────────────────────────────────────────
database:
  url: "${DATABASE_URL:sqlite+aiosqlite:///clawclip.db}"
  echo: false
  pool_size: 5

# ── Messaging Platforms ─────────────────────────────────────────
platforms:
  telegram:
    enabled: false
    bot_token: "${TELEGRAM_BOT_TOKEN:}"
    allowed_user_ids: "${ALLOWED_TELEGRAM_IDS:}"
    stream_edit_interval: 1.5
    max_message_length: 4000

  discord:
    enabled: false
    bot_token: "${DISCORD_BOT_TOKEN:}"
    guild_ids: []
    command_prefix: "!"

  slack:
    enabled: false
    bot_token: "${SLACK_BOT_TOKEN:}"
    app_token: "${SLACK_APP_TOKEN:}"
    signing_secret: "${SLACK_SIGNING_SECRET:}"

  whatsapp:
    enabled: false
    api_url: "${WHATSAPP_API_URL:}"
    api_token: "${WHATSAPP_API_TOKEN:}"
    phone_number_id: "${WHATSAPP_PHONE_NUMBER_ID:}"
    verify_token: "${WHATSAPP_VERIFY_TOKEN:}"

  signal:
    enabled: false
    signal_cli_path: "/usr/local/bin/signal-cli"
    phone_number: "${SIGNAL_PHONE_NUMBER:}"

  matrix:
    enabled: false
    homeserver: "${MATRIX_HOMESERVER:}"
    user_id: "${MATRIX_USER_ID:}"
    access_token: "${MATRIX_ACCESS_TOKEN:}"

  webui:
    enabled: false
    host: "0.0.0.0"
    port: 8080
    cors_origins: ["http://localhost:3000", "http://localhost:8080"]

  cli:
    enabled: false

# ── LLM Providers ──────────────────────────────────────────────
providers:
  claude_api:
    enabled: false
    api_key: "${ANTHROPIC_API_KEY:}"
    default_model: "claude-sonnet-4-20250514"
    max_tokens: 8192
    temperature: 0.7

  claude_cli:
    enabled: false
    default_model: "sonnet"
    default_cwd: "${CLAUDE_DEFAULT_CWD:.}"
    command_timeout: 300
    skip_permissions: true
    default_tools:
      - Read
      - Grep
      - Glob
      - Bash
      - Edit
      - Write

  openai:
    enabled: false
    api_key: "${OPENAI_API_KEY:}"
    default_model: "gpt-4o"
    organization: ""

  gemini:
    enabled: false
    api_key: "${GOOGLE_API_KEY:}"
    default_model: "gemini-2.0-flash"

  ollama:
    enabled: false
    base_url: "${OLLAMA_BASE_URL:http://localhost:11434}"
    default_model: "llama3.1"

  litellm:
    enabled: false
    base_url: "${LITELLM_BASE_URL:}"
    api_key: "${LITELLM_API_KEY:}"

  openai_compat:
    enabled: false
    base_url: "${OPENAI_COMPAT_BASE_URL:}"
    api_key: "${OPENAI_COMPAT_API_KEY:}"
    default_model: ""

# ── Provider Routing ────────────────────────────────────────────
routing:
  default_provider: "claude_api"
  default_model: "claude-sonnet-4-20250514"
  code_tasks:
    provider: "claude_api"
    model: "claude-sonnet-4-20250514"
  research_tasks:
    provider: "openai"
    model: "gpt-4o"
  simple_tasks:
    provider: "ollama"
    model: "llama3.1"

# ── Agents ──────────────────────────────────────────────────────
agents:
  coordinator:
    enabled: true
    provider: "claude_api"
    model: "claude-sonnet-4-20250514"
    system_prompt: >
      You are the Coordinator Agent for ClawClip. Your job is to analyze incoming
      tasks, decompose complex requests into sub-tasks, and delegate them to the
      most appropriate specialized agent. Collect results and synthesize a
      coherent final response.
    max_delegations: 5
    allowed_skills: ["*"]

  code:
    enabled: true
    provider: "claude_api"
    model: "claude-sonnet-4-20250514"
    system_prompt: >
      You are a Code Agent specializing in code generation, review, refactoring,
      and debugging. You have access to shell, file, and git tools.
    allowed_skills: ["shell", "files", "git"]

  research:
    enabled: true
    provider: "claude_api"
    model: "claude-sonnet-4-20250514"
    system_prompt: >
      You are a Research Agent. Search the web, read documentation, and
      synthesize information to answer questions thoroughly.
    allowed_skills: ["web_search"]

  system:
    enabled: true
    provider: "claude_api"
    model: "claude-sonnet-4-20250514"
    system_prompt: >
      You are a System Agent for shell commands, process management, system
      monitoring, and screenshots.
    allowed_skills: ["shell", "monitor", "screenshot", "services"]

  devops:
    enabled: true
    provider: "claude_api"
    model: "claude-sonnet-4-20250514"
    system_prompt: >
      You are a DevOps Agent for git workflows, CI/CD, deployment automation,
      and infrastructure management.
    allowed_skills: ["shell", "git", "ci_cd", "deployment"]

# ── Skills ──────────────────────────────────────────────────────
skills:
  builtin:
    shell:
      enabled: true
      timeout: 60
      max_output_size: 50000
      blocked_commands: ["format", "diskpart"]
    files:
      enabled: true
      allowed_roots: []
      blocked_patterns: [".env", "credentials", ".key", "id_rsa", ".pem", ".p12"]
      max_read_lines: 200
    git:
      enabled: true
    monitor:
      enabled: true
    screenshot:
      enabled: true
    web_search:
      enabled: false
      provider: "tavily"
      api_key: "${TAVILY_API_KEY:}"
    services:
      enabled: true

  developer:
    code_review:
      enabled: false
    pr_management:
      enabled: false
      github_token: "${GITHUB_TOKEN:}"
    ci_cd:
      enabled: false
    deployment:
      enabled: false
    log_analysis:
      enabled: false
    db_ops:
      enabled: false
    api_testing:
      enabled: false

  external_dirs: []

# ── Features (all toggleable) ──────────────────────────────────
features:
  multi_agent:
    enabled: true
    max_concurrent_agents: 5
    max_delegations_per_task: 10

  self_healing:
    enabled: true
    max_retries: 3
    escalate_to_human: true

  knowledge_base:
    enabled: false
    embedding_provider: "openai"
    vector_store: "chromadb"
    chromadb_url: "${CHROMADB_URL:http://localhost:8000}"
    chunk_size: 1000
    chunk_overlap: 200

  workflows:
    enabled: false
    workflow_dir: "config/workflows"

  scheduler:
    enabled: false
    timezone: "UTC"

  webhooks:
    enabled: false
    host: "0.0.0.0"
    port: 8081
    secret: "${WEBHOOK_SECRET:}"

  notifications:
    enabled: false
    digest_interval_minutes: 30

  teams:
    enabled: false
    max_workspaces: 10

  docker_sandbox:
    enabled: false
    default_image: "python:3.12-slim"
    memory_limit: "512m"
    cpu_limit: "1.0"
    network_access: false
    auto_cleanup: true

  conversation_branching:
    enabled: false

  replay_debug:
    enabled: true
    retention_days: 30

  mcp:
    enabled: false
    server_port: 8090
    external_servers: []

  dashboard:
    enabled: true
    host: "0.0.0.0"
    port: 8080
    jwt_secret: "${DASHBOARD_JWT_SECRET:change-me-in-production}"
    admin_username: "${DASHBOARD_ADMIN_USER:admin}"
    admin_password: "${DASHBOARD_ADMIN_PASSWORD:}"
    session_timeout_hours: 24

# ── Security ────────────────────────────────────────────────────
security:
  auth:
    default_role: "user"
    admin_ids: []

  rbac:
    roles:
      admin:
        permissions: ["*"]
      user:
        permissions:
          - "chat"
          - "shell.execute"
          - "files.read"
          - "files.list"
          - "files.write"
          - "monitor.view"
          - "screenshot.capture"
          - "session.manage"
          - "git.read"
          - "git.write"
      readonly:
        permissions:
          - "chat"
          - "files.read"
          - "files.list"
          - "monitor.view"

  approval:
    require_for:
      - "shell.execute_destructive"
      - "files.delete"
      - "services.stop"
      - "deployment.deploy"
    timeout_seconds: 120

  rate_limits:
    default:
      messages_per_minute: 30
      llm_requests_per_hour: 100
      cost_per_day_usd: 10.0

  vault:
    encryption_key: "${VAULT_ENCRYPTION_KEY:}"

# ── Hot Reload ──────────────────────────────────────────────────
hot_reload:
  enabled: true
  watch_paths:
    - "config/"
    - "clawclip/skills/"
