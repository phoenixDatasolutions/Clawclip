[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexusai"
version = "0.1.0"
description = "Modular multi-agent AI platform — connect any LLM, any messaging platform, with multi-agent orchestration"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "NexusAI Contributors" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Communications :: Chat",
]

dependencies = [
    # Core - always installed
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.20,<1",
    "alembic>=1.14,<2",
    "pyyaml>=6,<7",
    "structlog>=24.4,<26",
    "psutil>=6.0,<7",
    "mss>=9.0,<10",
    "Pillow>=11.0,<12",
    "pydantic>=2.0,<3",
    "cryptography>=43,<45",
    "rich>=13,<14",
    "questionary>=2.0,<3",
    "httpx>=0.27,<1",
    "click>=8.1,<9",
]

[project.optional-dependencies]
# --- Platforms ---
telegram = ["aiogram>=3.15,<4"]
discord = ["discord.py>=2.4,<3"]
slack = ["slack-bolt>=1.20,<2"]
whatsapp = []  # Uses httpx (core dep)
matrix = ["matrix-nio>=0.24,<1"]
cli-rich = ["typer>=0.12,<1"]

# --- LLM Providers ---
claude-api = ["anthropic>=0.40,<1"]
openai = ["openai>=1.50,<2"]
gemini = ["google-generativeai>=0.8,<1"]
ollama = []  # Uses httpx (core dep)
litellm = ["litellm>=1.50,<2"]

# --- Features ---
dashboard = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "websockets>=13,<14",
    "python-jose[cryptography]>=3.3,<4",
    "python-multipart>=0.0.9",
]
knowledge = [
    "chromadb>=0.5,<1",
    "sentence-transformers>=3.0,<4",
]
scheduler = ["apscheduler>=3.10,<4"]
mcp-support = ["mcp>=1.0,<2"]
sandbox = ["docker>=7.0,<8"]

# --- Bundles ---
all = [
    "nexusai[telegram,discord,slack,dashboard,cli-rich,claude-api,openai,gemini,ollama,knowledge,scheduler,mcp-support,sandbox]",
]
minimal = [
    "nexusai[telegram,claude-api,dashboard]",
]

# --- Test ---
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "pytest-cov>=6.0",
    "httpx>=0.27",       # For FastAPI TestClient async
    "aiosqlite>=0.20",   # For in-memory DB tests
]

# --- Dev ---
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=5.0,<6",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "pre-commit>=4.0,<5",
]

[project.scripts]
nexusai = "nexusai.__main__:main"

[project.urls]
Homepage = "https://github.com/user/nexusai"
Documentation = "https://github.com/user/nexusai/docs"
Repository = "https://github.com/user/nexusai"
Issues = "https://github.com/user/nexusai/issues"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
