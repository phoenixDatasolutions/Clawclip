[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests (may need API keys)
    e2e: End-to-end tests (requires full stack)
    slow: Tests that take more than 1 second
    requires_docker: Tests that need Docker running
    requires_telegram: Tests that need Telegram bot token
    requires_openai: Tests that need OpenAI API key
    requires_claude: Tests that need Anthropic API key
